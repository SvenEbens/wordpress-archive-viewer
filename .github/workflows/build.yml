# .github/workflows/build.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js (required for the frontend)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Install Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-pc-windows-msvc

      # Install Tauri dependencies for each platform
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk+3 librsvg libayatana-appindicator webkit2gtk

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Install npm dependencies
      - name: Install npm packages
        run: npm ci

      # Ensure runtime binaries are present for the target OS
      - name: Download runtime binaries
        run: |
          mkdir -p src-tauri/runtime/caddy src-tauri/runtime/php src-tauri/runtime/mariadb
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -L -o src-tauri/runtime/caddy/caddy.exe https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_windows_amd64.exe
            # For PHP and MariaDB on Windows you need to provide the binaries yourself or add steps to download and extract them.
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            curl -L -o caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_darwin_amd64.tar.gz
            tar -xzf caddy.tar.gz -C src-tauri/runtime/caddy --strip-components=1 caddy
            brew install php mariadb
          else
            curl -L -o src-tauri/runtime/caddy/caddy https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz
            tar -xzf src-tauri/runtime/caddy/caddy -C src-tauri/runtime/caddy --strip-components=1 caddy
            sudo apt-get install -y php-cli php-cgi mariadb-server
          fi

      # Build the frontend
      - name: Build frontend
        run: npm run build

      # Build the Tauri app (release)
      - name: Build Tauri app
        run: npm run tauri:build

      # Upload built artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: src-tauri/target/release/bundle/**
