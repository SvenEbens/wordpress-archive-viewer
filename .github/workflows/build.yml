# .github/workflows/build.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js (required for Tauri CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Install Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 on Linux needs these system libraries
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install npm dependencies
      - name: Install npm packages
        run: npm ci

      # Create runtime directories (Tauri bundles these with the app)
      - name: Setup runtime directories
        shell: bash
        run: |
          mkdir -p src-tauri/runtime/caddy
          mkdir -p src-tauri/runtime/php
          mkdir -p src-tauri/runtime/mariadb

      # Download Caddy for each platform
      - name: Download Caddy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_windows_amd64.zip" -OutFile caddy.zip
          Expand-Archive caddy.zip -DestinationPath src-tauri/runtime/caddy -Force
          # Keep only caddy.exe
          if (Test-Path src-tauri/runtime/caddy/caddy.exe) {
            Write-Host "Caddy downloaded successfully"
          }

      - name: Download Caddy (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L -o caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_mac_amd64.tar.gz
          tar -xzf caddy.tar.gz -C src-tauri/runtime/caddy
          chmod +x src-tauri/runtime/caddy/caddy

      - name: Download Caddy (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L -o caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz
          tar -xzf caddy.tar.gz -C src-tauri/runtime/caddy
          chmod +x src-tauri/runtime/caddy/caddy

      # Create placeholder files for PHP and MariaDB runtimes
      # (these are large binaries that must be provided per-platform)
      - name: Create runtime placeholders
        shell: bash
        run: |
          touch src-tauri/runtime/php/.gitkeep
          touch src-tauri/runtime/mariadb/.gitkeep

      # Build the Tauri app (this also builds the frontend)
      - name: Build Tauri app
        run: npm run tauri:build

      # Package portable app
      - name: Package Portable App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy/archives
          Copy-Item src-tauri/target/release/wordpress-archive-viewer.exe -Destination deploy/
          Copy-Item src-tauri/runtime -Destination deploy/ -Recurse
          Compress-Archive -Path deploy/* -DestinationPath wordpress-archive-viewer-windows.zip

      - name: Package Portable App (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p deploy/archives
          cp -R "src-tauri/target/release/bundle/macos/WordPress Archive Viewer.app" deploy/
          cp -R src-tauri/runtime deploy/
          cd deploy && zip -r ../wordpress-archive-viewer-macos.zip .

      - name: Package Portable App (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p deploy/archives
          cp src-tauri/target/release/wordpress-archive-viewer deploy/
          cp -R src-tauri/runtime deploy/
          cd deploy && tar -czf ../wordpress-archive-viewer-linux.tar.gz .

      # Upload portable artifacts
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: wordpress-archive-viewer-windows.zip

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable
          path: wordpress-archive-viewer-macos.zip

      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: wordpress-archive-viewer-linux.tar.gz
